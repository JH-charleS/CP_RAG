<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP_RAG Assistant</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: #94a3b8; }
    .chat {
      min-height: 360px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 12px;
      background: #020617;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .msg { margin: 10px 0; line-height: 1.6; white-space: pre-wrap; }
    .user { color: #93c5fd; }
    .assistant { color: #86efac; }
    .meta { color: #cbd5e1; font-size: 12px; margin-top: 4px; }
    .input-wrap { display: flex; gap: 8px; margin-top: 12px; }
    .toolbar { display: flex; gap: 8px; margin: 10px 0; align-items: center; }
    .toolbar input {
      width: 220px;
      background: #0b1220;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }
    textarea {
      flex: 1;
      resize: vertical;
      min-height: 80px;
      background: #0b1220;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      width: 140px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    .btn-secondary { background: #334155; width: 180px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>CP_RAG 助教</h1>
      <p>输入算法问题，后端会自动执行缓存、题号检索和 RAG 检索链路。</p>
    </div>
    <div class="card">
      <div id="chat" class="chat"></div>
      <div class="toolbar">
        <input id="sessionIdInput" value="default" placeholder="会话ID（可自定义）" />
        <button id="finishBtn" class="btn-secondary" type="button">结束当前问题</button>
      </div>
      <div class="input-wrap">
        <textarea id="queryInput" placeholder="例如：LeetCode 1 two sum 怎么做？"></textarea>
        <button id="sendBtn" type="button">发送问题</button>
      </div>
    </div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("sendBtn");
    const finishBtn = document.getElementById("finishBtn");
    const queryInput = document.getElementById("queryInput");
    const sessionIdInput = document.getElementById("sessionIdInput");

    function appendMessage(role, text, meta = "") {
      const block = document.createElement("div");
      block.className = "msg " + role;
      block.textContent = (role === "user" ? "你: " : "助手: ") + text;
      chat.appendChild(block);
      if (meta) {
        const metaDiv = document.createElement("div");
        metaDiv.className = "meta";
        metaDiv.textContent = meta;
        chat.appendChild(metaDiv);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendQuery(forceFinish = false) {
      const query = queryInput.value.trim() || (forceFinish ? "结束当前问题" : "");
      if (!query) return;
      const sessionId = (sessionIdInput.value || "default").trim();

      appendMessage("user", query);
      if (!forceFinish) queryInput.value = "";
      sendBtn.disabled = true;
      finishBtn.disabled = true;
      sendBtn.textContent = "请求中...";

      try {
        const res = await fetch("/api/v1/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, session_id: sessionId, finish_current: forceFinish })
        });
        const data = await res.json();
        if (!res.ok) {
          appendMessage("assistant", "请求失败: " + (data.detail || "unknown error"));
        } else {
          appendMessage(
            "assistant",
            data.answer,
            `session=${data.session_id}, from_cache=${data.from_cache}, matched_problem_id=${data.matched_problem_id}, active_problem_id=${data.active_problem_id}, waiting_for_completion=${data.waiting_for_completion}, rag_hits=${data.rag_hits}`
          );
        }
      } catch (err) {
        appendMessage("assistant", "网络异常: " + err);
      } finally {
        sendBtn.disabled = false;
        finishBtn.disabled = false;
        sendBtn.textContent = "发送问题";
      }
    }

    sendBtn.addEventListener("click", sendQuery);
    finishBtn.addEventListener("click", () => sendQuery(true));
    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuery();
      }
    });
  </script>
</body>
</html>
